<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f1" />
    <title>MixImage · 图片创作工具</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./">
          <span class="brand-mark" aria-hidden="true">M</span>
          <span class="brand-copy">
            <strong>MixImage</strong>
            <span>轻松合成你的长图</span>
          </span>
        </a>
        <nav class="tool-nav" aria-label="功能选择">
          <button class="tool-nav-button is-active" type="button" data-workspace="composer" aria-pressed="true">
            <span aria-hidden="true">↕</span>长图合成
          </button>
          <button class="tool-nav-button" type="button" data-workspace="album" aria-pressed="false">
            <span aria-hidden="true">▦</span>相册拼图
          </button>
        </nav>
      </header>

      <main class="workspace">
        <section id="composerWorkspace" class="workspace-section">
          <div class="intro">
          <div>
            <p class="eyebrow">IMAGE COMPOSER</p>
            <h1>图片合成</h1>
          </div>
          </div>

          <div class="studio-grid">
          <div class="control-panel">
            <div class="panel-heading">
              <div>
                <p class="section-kicker">图片来源</p>
                <h2>导入图片</h2>
              </div>
              <button id="clearButton" class="text-button" type="button" disabled>清空 <span aria-hidden="true">⌫</span></button>
            </div>

            <label class="dropzone" id="dropzone" for="fileInput">
              <input id="fileInput" type="file" accept="image/*" multiple />
              <span class="drop-icon" aria-hidden="true">↥</span>
              <strong>拖动图片到这里</strong>
              <span>或点击选择文件 · 支持 JPG / PNG / WEBP</span>
            </label>

            <div class="queue-heading">
              <div>
                <p class="section-kicker">图片队列</p>
                <h2>排列顺序 <span id="imageCount">0</span></h2>
              </div>
              <span class="drag-hint">拖动卡片调整顺序</span>
            </div>
            <div id="queue" class="queue empty-state">
              <div class="empty-queue">
                <span aria-hidden="true">▧</span>
                <p>还没有图片</p>
                <small>先把几张图片放进来吧</small>
              </div>
            </div>

            <div class="panel-footer">
              <button id="downloadButton" class="primary-button" type="button" disabled>
                <span>导出长图</span><span aria-hidden="true">↓</span>
              </button>
            </div>
          </div>

          <div class="preview-panel">
            <div class="panel-heading preview-heading">
              <div>
                <h2>合成结果</h2>
              </div>
              <div class="preview-heading-tools">
                <div class="layout-control">
                  <span class="control-label">列数</span>
                  <div class="segmented-control" role="group" aria-label="方图排列列数">
                    <button id="oneColumnButton" type="button" data-columns="1" aria-pressed="false">1 列</button>
                    <button id="threeColumnButton" type="button" class="is-active" data-columns="3" aria-pressed="true">3 列</button>
                  </div>
                </div>
                <div class="background-control">
                  <label class="background-picker" for="backgroundColor" title="选择背景色">
                    <span id="backgroundSwatch" class="background-swatch" aria-hidden="true"></span>
                    <span class="background-copy"><span>背景色</span><strong id="backgroundValue">自动主题</strong></span>
                    <input id="backgroundColor" type="color" value="#ffffff" aria-label="选择背景色" />
                  </label>
                </div>
              </div>
            </div>
            <div id="previewFrame" class="preview-frame empty-preview">
              <div class="preview-empty-content">
                <div class="preview-placeholder" aria-hidden="true"><span></span><span></span><span></span></div>
                <p>你的合成图会出现在这里</p>
                <small>添加图片后实时预览</small>
              </div>
              <canvas id="resultCanvas" aria-label="图片合成预览"></canvas>
            </div>
          </div>
          </div>
        </section>

        <section id="albumWorkspace" class="workspace-section" hidden>
          <div class="intro album-intro">
            <div>
              <p class="eyebrow">A3 PHOTO ALBUM</p>
              <h1>相册拼图</h1>
            </div>
            <span class="a3-spec">A3 横版 · 3508 × 2480 px</span>
          </div>

          <div class="studio-grid album-studio-grid">
            <div class="control-panel album-control-panel">
              <div class="panel-heading">
                <div>
                  <p class="section-kicker">照片素材</p>
                  <h2>导入相册照片</h2>
                </div>
                <button id="albumClearButton" class="text-button" type="button" disabled>清空 <span aria-hidden="true">⌫</span></button>
              </div>

              <label class="dropzone album-dropzone" id="albumDropzone" for="albumFileInput">
                <input id="albumFileInput" type="file" accept="image/*" multiple />
                <span class="drop-icon" aria-hidden="true">↥</span>
                <strong>拖入多张照片</strong>
                <span>每页自动安排 2 至 6 张</span>
              </label>

              <div id="albumQueue" class="album-queue" aria-live="polite"></div>
              <p id="albumStatus" class="album-status">等待添加照片</p>

              <div class="copy-fields">
                <label class="field-label" for="albumTitle">
                  <span>当前页标题</span>
                  <input id="albumTitle" type="text" maxlength="32" placeholder="例如：海边的夏天" />
                </label>
                <label class="field-label" for="albumCopy">
                  <span>当前页文案</span>
                  <textarea id="albumCopy" rows="4" maxlength="180" placeholder="写下照片背后的故事…"></textarea>
                </label>
              </div>

              <div class="album-background-control" aria-label="画布背景色">
                <div class="album-background-heading">
                  <span class="control-label">画布背景</span>
                  <strong id="albumBackgroundValue">自动选色</strong>
                </div>
                <div class="album-background-actions">
                  <div class="segmented-control" role="group" aria-label="画布背景模式">
                    <button id="albumAutoBackground" class="is-active" type="button" aria-pressed="true">自动选色</button>
                    <button id="albumManualBackground" type="button" aria-pressed="false">自定义</button>
                  </div>
                  <label class="background-picker album-background-picker" for="albumBackgroundColor" title="选择自定义背景色">
                    <span id="albumBackgroundSwatch" class="background-swatch" aria-hidden="true"></span>
                    <input id="albumBackgroundColor" type="color" value="#ffffff" aria-label="自定义画布背景色" />
                  </label>
                </div>
              </div>

              <div id="albumTextControl" class="album-text-control" hidden>
                <div class="album-text-heading">
                  <span class="control-label">文案样式</span>
                  <div class="segmented-control" role="group" aria-label="文案样式对象">
                    <button id="albumTextTitleTarget" class="is-active" type="button" aria-pressed="true">标题</button>
                    <button id="albumTextCopyTarget" type="button" aria-pressed="false">正文</button>
                  </div>
                </div>
                <div class="album-text-style-grid">
                  <label class="field-label" for="albumFontFamily">
                    <span>字体</span>
                    <select id="albumFontFamily" class="style-select">
                      <option value="'Microsoft YaHei', '微软雅黑', sans-serif">微软雅黑</option>
                      <option value="'SimSun', '宋体', serif">宋体</option>
                      <option value="'SimHei', '黑体', sans-serif">黑体</option>
                      <option value="'KaiTi', '楷体', serif">楷体</option>
                      <option value="'FangSong', '仿宋', serif">仿宋</option>
                      <option value="Arial, sans-serif">Arial</option>
                      <option value="'Times New Roman', serif">Times New Roman</option>
                      <option value="Georgia, serif">Georgia</option>
                      <option value="'Courier New', monospace">Courier New</option>
                    </select>
                  </label>
                  <label class="field-label" for="albumFontWeight">
                    <span>粗细</span>
                    <select id="albumFontWeight" class="style-select">
                      <option value="400">常规</option>
                      <option value="500">中等</option>
                      <option value="600">半粗</option>
                      <option value="700">粗体</option>
                    </select>
                  </label>
                  <label class="field-label" for="albumFontSize">
                    <span>字号 <output id="albumFontSizeValue">88 px</output></span>
                    <input id="albumFontSize" type="range" min="40" max="160" step="1" value="88" />
                  </label>
                  <label class="field-label album-font-color" for="albumFontColor">
                    <span>颜色</span>
                    <span class="album-font-color-picker"><span id="albumFontColorSwatch" class="background-swatch" aria-hidden="true"></span><input id="albumFontColor" type="color" value="#222829" aria-label="文案颜色" /></span>
                  </label>
                </div>
              </div>

              <div class="panel-footer album-footer">
                <span id="albumExportNote" class="format-note">A3 PNG · 多页打包 ZIP</span>
                <button id="albumDownloadButton" class="primary-button" type="button" disabled>
                  <span>导出全部</span><span aria-hidden="true">↓</span>
                </button>
              </div>
            </div>

            <div class="preview-panel album-preview-panel">
              <div class="panel-heading preview-heading">
                <div>
                  <p class="section-kicker">实时预览</p>
                  <h2>A3 横版画布</h2>
                </div>
                <div class="album-preview-tools">
                  <select id="albumPageSize" class="layout-select" aria-label="每页图片数量">
                    <option value="auto">自动布局</option>
                    <option value="2">每页 2 张</option>
                    <option value="3">每页 3 张</option>
                    <option value="4">每页 4 张</option>
                    <option value="5">每页 5 张</option>
                    <option value="6">每页 6 张</option>
                  </select>
                  <span id="albumLayoutName" class="mode-badge">等待图片</span>
                  <div class="page-stepper" aria-label="相册页码">
                    <button id="albumPreviousPage" type="button" aria-label="上一页" disabled>‹</button>
                    <span id="albumPageValue">0 / 0</span>
                    <button id="albumNextPage" type="button" aria-label="下一页" disabled>›</button>
                  </div>
                </div>
              </div>
              <div id="albumEditControl" class="album-edit-control" hidden>
                <div class="album-edit-heading">
                  <span class="control-label">当前图片</span>
                  <strong id="albumSelectionLabel">未选择</strong>
                  <button id="albumResetTransform" class="text-button" type="button">恢复</button>
                </div>
                <label class="album-scale-control" for="albumScaleRange">
                  <span>缩放 <output id="albumScaleValue">100%</output></span>
                  <input id="albumScaleRange" type="range" min="1" max="2.5" step="0.05" value="1" />
                </label>
                <div class="album-rotate-actions" role="group" aria-label="旋转图片">
                  <button id="albumRotateLeft" type="button" aria-label="向左旋转">↶</button>
                  <button id="albumRotateRight" type="button" aria-label="向右旋转">↷</button>
                </div>
              </div>
              <div id="albumPreviewFrame" class="preview-frame album-preview-frame empty-preview">
                <div class="preview-empty-content">
                  <div class="album-placeholder" aria-hidden="true"><span></span><span></span><span></span></div>
                  <p>拖入照片开始排版</p>
                  <small>添加 2 张后自动生成第一页</small>
                </div>
                <canvas id="albumCanvas" aria-label="A3 相册拼图预览"></canvas>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
